<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AIOS</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <header>
        <span class="brand">AIOS</span>
        <button id="new-chat" title="新对话">＋</button>
      </header>
      <ul id="chat-list"></ul>
    </aside>
    <div id="overlay"></div>
    <main id="workspace">
      <header id="chat-header">
        <span id="header-left">
          <button id="menu-btn" title="切换侧边栏" aria-label="切换侧边栏">☰</button>
          <span id="chat-title">新对话</span>
        </span>
        <span id="chat-actions">
          <button id="stop-chat" hidden>停止</button>
          <button id="delete-chat" hidden>删除</button>
        </span>
      </header>
      <div id="thread"></div>
      <footer id="composer">
        <textarea id="input" rows="2" placeholder="输入消息,Enter 发送,Shift+Enter 换行"></textarea>
        <button id="send">发送</button>
      </footer>
    </main>
  </div>
  <script src="/vendor/marked.min.js"></script>
  <script src="/vendor/purify.min.js"></script>
  <script type="module" src="/app.js"></script>
</body>
</html>
