<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AGENT · graphite · 设置</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="shell" id="shell">

  <aside class="sidebar">
    <a class="brand" href="index.html"><span class="brand-mark">A</span><span class="brand-name">AGENT</span></a>
    <a class="new-chat" href="new.html"><i>＋</i>新对话</a>
    <div class="sidebar-label">对话</div>
    <nav class="chat-list">
      <button class="chat-row">
        <span class="status-dot running"></span>
        <span class="chat-copy"><b>迁移 SQLite schema</b></span>
        <span class="delete-chat">×</span>
      </button>
      <button class="chat-row">
        <span class="status-dot"></span>
        <span class="chat-copy"><b>修复 SSE 断线重连</b></span>
        <span class="delete-chat">×</span>
      </button>
      <button class="chat-row">
        <span class="status-dot"></span>
        <span class="chat-copy"><b>重构事件订阅</b></span>
        <span class="delete-chat">×</span>
      </button>
      <button class="chat-row">
        <span class="status-dot"></span>
        <span class="chat-copy"><b>整理仓库文档</b></span>
        <span class="delete-chat">×</span>
      </button>
    </nav>
    <div class="sidebar-bottom">
      <a class="settings-link active" href="settings.html"><span>⚙</span><span>设置</span></a>
    </div>
  </aside>

  <section class="settings-page">
    <header class="settings-header">
      <h1>设置</h1>
    </header>
    <div class="settings-scroll">
      <form class="settings-form" onsubmit="return false">

        <section class="settings-group">
          <div class="settings-group-title">
            <h2>模型</h2>
            <p>兼容 OpenAI Responses API 的上游服务。</p>
          </div>
          <div class="settings-card">
            <label class="setting-row">
              <span><b>Responses API 地址</b></span>
              <span class="setting-control"><input type="url" value=""></span>
            </label>
            <label class="setting-row">
              <span><b>密钥</b></span>
              <span class="setting-control">
                <input type="password" placeholder="已配置,留空保持不变">
                <button class="clear-key" type="button">清除</button>
              </span>
            </label>
            <label class="setting-row">
              <span><b>模型</b></span>
              <span class="setting-control"><input type="text" value="deepseek/deepseek-v4-flash"></span>
            </label>
          </div>
        </section>

        <section class="settings-group">
          <div class="settings-group-title">
            <h2>上下文</h2>
            <p>上下文窗口与自动压缩水位。</p>
          </div>
          <div class="settings-card">
            <label class="setting-row">
              <span><b>上下文窗口</b></span>
              <span class="setting-control"><input type="number" value="1048576"></span>
            </label>
            <label class="setting-row">
              <span><b>压缩预留 Token</b></span>
              <span class="setting-control"><input type="number" value="16000"></span>
            </label>
            <label class="setting-row">
              <span><b>保留最近 Token</b></span>
              <span class="setting-control"><input type="number" value="20000"></span>
            </label>
            <label class="setting-row">
              <span><b>工具结果最大字符</b></span>
              <span class="setting-control"><input type="number" value="8000"></span>
            </label>
          </div>
        </section>

        <section class="settings-group">
          <div class="settings-group-title">
            <h2>提示词</h2>
            <p>对话提示词支持 {{chat_id}} 和 {{api_url}} 占位符。</p>
          </div>
          <div class="settings-card">
            <label class="setting-row">
              <span><b>对话提示词</b></span>
              <span class="setting-control"><textarea>你是运行在用户本机的 coding agent。当前对话 ID:{{chat_id}},Agent 模型服务地址:{{api_url}}。通过 bash 读取项目、执行命令并验证结果;需要并行处理时,可通过 API 创建其他对话并异步调用。</textarea></span>
            </label>
            <label class="setting-row">
              <span><b>压缩提示词</b></span>
              <span class="setting-control"><textarea>将以下对话历史压缩为要点。保留:正在进行的任务、已确认的结论、未完成的步骤与关键文件路径。省略:过程性输出与重复内容。</textarea></span>
            </label>
          </div>
        </section>

        <div class="settings-actions">
          <span class="saved">已保存</span>
          <button class="save" type="submit">保存更改</button>
        </div>

      </form>
    </div>
  </section>

</div>
<script src="app.js"></script>
</body>
</html>
